name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: app/Views/partials/
          server-dir: app/Views/partials/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.osp/**
            **/.codex-tmp/**
            **/.env
            **/config/db.php
            **/storage/backups/**
            **/storage/logs/**
            **/*.log
            **/database/import/sources/**
            **/database/import/batches/**
            **/database/import/*.pdf
            **/database/import/*.rar